[project]
name = "english-trainer"
version = "0.1.0"
description = "Personal interactive English-learning platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "pyyaml>=6.0.3",
    "openai>=3.1.0",
    "python-multipart>=0.0.20",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic revision files are generated, not hand-formatted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` in a default argument is FastAPI's dependency-injection
# idiom, not the mutable-default-argument bug this rule targets elsewhere.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
