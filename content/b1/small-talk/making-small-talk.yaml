# Format reference lesson for Phase 2 — see docs/database-schema.md and
# app/schemas/content.py for the shape this file is validated against.
level:
  code: B1
  order_index: 3

module:
  slug: small-talk
  title: Small Talk
  order_index: 1

lesson:
  slug: making-small-talk
  title: Making Small Talk
  order_index: 1

blocks:
  - type: learning_goals
    order_index: 1
    content:
      goals:
        - "Start a conversation with someone you don't know well"
        - "Keep a casual conversation going without awkward silences"
        - "Use question tags to sound more natural and invite a reply"
        - "Recognise and use 6 common small-talk expressions"

  - type: context
    order_index: 2
    content:
      text: >
        Small talk is the light, casual conversation people have before or
        instead of a "real" conversation — at the coffee machine, in a
        waiting room, at the start of a meeting, or while queueing. It isn't
        about the content (the weather, the weekend, traffic); it's about
        signalling that you're friendly and open to talking. Native speakers
        rely on a small set of safe topics and a few fixed phrases, which
        makes it very learnable.
      summary_ru: >
        Small talk — лёгкий разговор ни о чём (погода, выходные, пробки)
        перед серьёзным разговором или вместо него. Его цель — не содержание,
        а сигнал «я дружелюбен и открыт к общению». Носители языка используют
        небольшой набор безопасных тем и несколько устойчивых фраз, поэтому
        этому легко научиться.

  - type: vocabulary
    order_index: 3
    content:
      items:
        - headword: "small talk"
          translation: "светская беседа, непринуждённый разговор"
          example_sentence: "I'm not very good at small talk with people I've just met."
        - headword: "catch up"
          translation: "наверстать упущенное, обменяться новостями"
          example_sentence: "Let's catch up over coffee sometime this week."
        - headword: "how's it going"
          translation: "как дела"
          example_sentence: "Hey, how's it going? I haven't seen you in ages."
        - headword: "awkward silence"
          translation: "неловкое молчание"
          example_sentence: "There was an awkward silence after the joke fell flat."
        - headword: "get along (with someone)"
          translation: "ладить (с кем-то)"
          example_sentence: "We get along really well with our new neighbours."
        - headword: "bring up (a topic)"
          translation: "поднимать (тему)"
          example_sentence: "It's best not to bring up politics at a work party."

  - type: grammar
    order_index: 4
    content:
      topics:
        - slug: question-tags
          title: Question Tags
          description: >
            Short questions added to the end of a statement to invite
            agreement or keep the other person talking, e.g. "Nice weather,
            isn't it?", "You're new here, aren't you?", "You don't smoke, do
            you?". A positive statement takes a negative tag and a negative
            statement takes a positive tag. Very common in small talk
            because they turn a flat statement into an opening for a reply.

  - type: examples
    order_index: 5
    content:
      dialogues:
        - title: At the coffee machine
          lines:
            - speaker: A
              text: "Hey, how's it going? Long time no see."
            - speaker: B
              text: "Good, thanks! Busy week, though. How about you?"
            - speaker: A
              text: "Same here. This project isn't getting any easier, is it?"
            - speaker: B
              text: "Tell me about it. We should catch up properly sometime — grab lunch?"
            - speaker: A
              text: "Sounds good. You're free on Thursday, aren't you?"

  - type: exercises
    order_index: 6
    content:
      items:
        - slug: making-small-talk-mc-catch-up
          type: multiple_choice
          skill: vocabulary
          difficulty: B1
          vocabulary_headword: "catch up"
          prompt:
            question: >-
              What does "catch up" mean in "Let's catch up over coffee
              sometime"?
            options:
              - id: a
                text: To run faster than someone
              - id: b
                text: To meet and share recent news
              - id: c
                text: To finish a task on time
              - id: d
                text: To argue about something
          answer_key:
            correct_option_id: b
          explanation: >-
            "Catch up" here means to meet someone and talk about what's
            happened recently — it has nothing to do with speed or
            deadlines.

        - slug: making-small-talk-fill-question-tags
          type: fill_blank
          skill: grammar
          difficulty: B1
          grammar_topic_slug: question-tags
          prompt:
            text: >-
              Complete the question tags: 1) "It's a nice day, ___ it?"
              2) "You haven't been here before, ___ you?"
          answer_key:
            blanks:
              - ["isn't"]
              - ["have"]
          explanation: >-
            A positive statement takes a negative tag ("It's" -> "isn't
            it?"); a negative statement takes a positive tag ("haven't"
            -> "have you?").

        - slug: making-small-talk-order-catch-up
          type: sentence_ordering
          skill: grammar
          difficulty: B1
          vocabulary_headword: "catch up"
          prompt:
            words: ["catch", "should", "sometime", "up", "We", "properly"]
          answer_key:
            correct_order: ["We", "should", "catch", "up", "properly", "sometime"]
          explanation: >-
            Standard English word order: subject ("We") + modal ("should")
            + verb phrase ("catch up properly") + time expression
            ("sometime").

        - slug: making-small-talk-reading-art-of-small-talk
          type: reading_comprehension
          skill: reading
          difficulty: B1
          prompt:
            passage: >-
              In most English-speaking workplaces, a conversation rarely
              starts with business straight away. Colleagues usually spend
              thirty seconds to a minute on small talk first. Skipping this
              step can come across as cold, even if that isn't the
              intention. The trick isn't having something interesting to
              say; it's showing you're willing to listen. Ask a short
              question, react to the answer, and add a question tag if you
              want to keep the other person talking.
            questions:
              - id: q1
                text: >-
                  Why might skipping small talk seem cold, even if that
                  isn't intended?
                options:
                  - id: a
                    text: Because it makes the conversation too long
                  - id: b
                    text: Because it can seem unfriendly, even without meaning to be
                  - id: c
                    text: Because small talk is required by company policy
                  - id: d
                    text: Because colleagues expect a joke first
              - id: q2
                text: >-
                  According to the text, what's the real trick to small
                  talk?
                options:
                  - id: a
                    text: Having something interesting to say
                  - id: b
                    text: Talking as much as possible
                  - id: c
                    text: Showing you're willing to listen
                  - id: d
                    text: Avoiding all questions
          answer_key:
            answers:
              q1: b
              q2: c
          explanation: >-
            The passage says skipping small talk "can come across as cold,
            even if that isn't the intention" (Q1), and that the trick
            "isn't having something interesting to say; it's showing you're
            willing to listen" (Q2).

        - slug: making-small-talk-listening-coffee-machine
          type: listening_comprehension
          skill: listening
          difficulty: B1
          prompt:
            # Same file as the lesson's own `listening` block below —
            # generate_audio.py only tracks/regenerates the `listening`
            # block's copy, not this one.
            audio_url: "/audio/making-small-talk.mp3"
            transcript: >
              A: Hey, how's it going? — B: Good, thanks! Busy week, though.
              How about you? — A: Same here. This project isn't getting any
              easier, is it? — B: Tell me about it. We should catch up
              properly sometime — grab lunch? — A: Sounds good. You're free
              on Thursday, aren't you?
            questions:
              - id: q1
                text: "How does B describe their week?"
                options:
                  - id: a
                    text: Busy
                  - id: b
                    text: Relaxing
                  - id: c
                    text: Boring
                  - id: d
                    text: We don't know
              - id: q2
                text: "What does B suggest they do?"
                options:
                  - id: a
                    text: Go for lunch together
                  - id: b
                    text: Finish the project
                  - id: c
                    text: Take a day off
                  - id: d
                    text: We don't know
          answer_key:
            answers:
              q1: a
              q2: a
          explanation: >-
            "Busy week, though" (Q1 — busy); "We should catch up properly
            sometime — grab lunch?" (Q2 — go for lunch together).

  - type: reading
    order_index: 7
    content:
      title: The Art of Small Talk
      text: >
        In most English-speaking workplaces, a conversation rarely starts
        with business straight away. Colleagues usually spend thirty seconds
        to a minute on small talk first — the weekend, the weather, a
        delayed train. Skipping this step can come across as cold, even if
        that isn't the intention. The trick isn't having something
        interesting to say; it's showing you're willing to listen. Ask a
        short question, react to the answer, and add a question tag if you
        want to keep the other person talking: "You had a good weekend,
        didn't you?" opens the door far more naturally than "Did you have a
        good weekend?" on its own.
      summary_ru: >
        В англоязычных компаниях разговор редко начинается сразу с дела —
        сначала 30-60 секунд small talk. Пропустить этот шаг — значит
        показаться холодным, даже не желая этого. Секрет не в том, чтобы
        сказать что-то интересное, а в том, чтобы показать готовность
        слушать: задать короткий вопрос, отреагировать на ответ и добавить
        question tag, если хочешь продолжить разговор.

  - type: listening
    order_index: 8
    content:
      audio_url: "/audio/making-small-talk.mp3"  # src-hash: 9fd62a1e
      transcript: >
        A: Hey, how's it going? — B: Good, thanks! Busy week, though. How
        about you? — A: Same here. This project isn't getting any easier,
        is it? — B: Tell me about it. We should catch up properly sometime —
        grab lunch? — A: Sounds good. You're free on Thursday, aren't you?

  - type: speaking
    order_index: 9
    content:
      prompt: >
        Imagine you're at a work event and you don't know many people.
        Practise starting a conversation with someone new: greet them, ask
        one question about their day or the event, react to their answer,
        and use at least one question tag. Speak for about 60 seconds.

  - type: homework
    order_index: 10
    content:
      tasks:
        - type: writing
          instructions: >
            Write a short dialogue (6–8 lines) between two people making
            small talk at a bus stop. Use at least 3 vocabulary items from
            this lesson.
        - type: vocabulary_recall
          instructions: >
            Without looking back at the lesson, write down as many
            small-talk expressions as you remember, then check your list
            against the vocabulary block.
        - type: grammar_practice
          instructions: >
            Write 5 sentences about your own life using question tags, e.g.
            "You work in IT, don't you?"

  - type: review
    order_index: 11
    content:
      note: >
        Review items for this lesson's vocabulary and the question-tags
        grammar topic are generated automatically from mistakes and spaced
        repetition once Phase 4 is implemented — nothing to author here yet.

  - type: mini_test
    order_index: 12
    content:
      items:
        - slug: making-small-talk-mini-mc-awkward-silence
          type: multiple_choice
          skill: vocabulary
          difficulty: B1
          vocabulary_headword: "awkward silence"
          prompt:
            question: >-
              What does "awkward silence" describe?
            options:
              - id: a
                text: An uncomfortable pause when no one is talking
              - id: b
                text: A loud argument
              - id: c
                text: A planned moment of quiet in a meeting
              - id: d
                text: A quiet, relaxing evening at home
          answer_key:
            correct_option_id: a
          explanation: >-
            An "awkward silence" is an uncomfortable pause in conversation
            — not a loud argument, a planned pause, or a relaxing evening.

        - slug: making-small-talk-mini-fill-question-tags-2
          type: fill_blank
          skill: grammar
          difficulty: B1
          grammar_topic_slug: question-tags
          prompt:
            text: >-
              Complete the question tags: 1) "You're new here, ___ you?"
              2) "She doesn't work here, ___ she?"
          answer_key:
            blanks:
              - ["aren't"]
              - ["does"]
          explanation: >-
            A positive statement takes a negative tag ("You're" -> "aren't
            you?"); a negative statement takes a positive tag ("doesn't" ->
            "does she?").

        - slug: making-small-talk-mini-order-get-along
          type: sentence_ordering
          skill: grammar
          difficulty: B1
          vocabulary_headword: "get along (with someone)"
          prompt:
            words: ["along", "get", "really", "We", "well"]
          answer_key:
            correct_order: ["We", "get", "along", "really", "well"]
          explanation: >-
            Subject ("We") + verb phrase ("get along") + intensifier +
            adverb ("really well").

        - slug: making-small-talk-mini-mc-bring-up
          type: multiple_choice
          skill: vocabulary
          difficulty: B1
          vocabulary_headword: "bring up (a topic)"
          prompt:
            question: >-
              What does "bring up a topic" mean?
            options:
              - id: a
                text: To raise or start talking about a subject
              - id: b
                text: To avoid a subject completely
              - id: c
                text: To finish a conversation
              - id: d
                text: To speak more loudly
          answer_key:
            correct_option_id: a
          explanation: >-
            "Bring up" means to introduce a topic into a conversation — not
            avoid it, end it, or speak louder.

        - slug: making-small-talk-mini-reading-recap
          type: reading_comprehension
          skill: reading
          difficulty: B1
          prompt:
            passage: >-
              Small talk isn't about the content — it's a signal that
              you're friendly and open to talking. Native speakers rely on
              a small set of safe topics and a few fixed phrases, which
              makes it very learnable.
            questions:
              - id: q1
                text: "What does small talk mainly signal?"
                options:
                  - id: a
                    text: That you are friendly and open to talking
                  - id: b
                    text: That you have important news
                  - id: c
                    text: That the conversation is over
                  - id: d
                    text: That you disagree with someone
          answer_key:
            answers:
              q1: a
          explanation: >-
            The passage says small talk's purpose "isn't about the
            content" but signalling "you're friendly and open to talking".
