level:
  code: B1
  order_index: 3

module:
  slug: opinions
  title: Expressing Opinions
  order_index: 3

lesson:
  slug: expressing-opinions
  title: Expressing Opinions
  order_index: 1

blocks:
  - type: learning_goals
    order_index: 1
    content:
      goals:
        - "Give and support an opinion clearly in a discussion"
        - "Agree and disagree politely with someone else's opinion"
        - "Contrast two ideas using although, even though, despite and in spite of"
        - "Use 6 new phrases for expressing and discussing opinions"

  - type: context
    order_index: 2
    content:
      text: >
        To give an opinion, English speakers rarely just state a fact —
        they soften it with a phrase: "In my opinion...", "I'd say
        that...", "As far as I'm concerned...", "Personally, I think...".
        To agree: "I couldn't agree more.", "That's exactly what I
        think.". To disagree politely: "I see your point, but...", "I'm
        not so sure about that.", "I take your point, although...".
        "Although" and "even though" are followed by a clause (subject +
        verb): "Although it was expensive, we bought it." "Despite" and
        "in spite of" are followed by a noun or -ing form, not a full
        clause: "Despite the price, we bought it." / "In spite of being
        expensive, we bought it." A common mistake is following "despite"
        with a full clause the same way as "although".
      summary_ru: >
        Мнение редко подают как голый факт — его смягчают фразой: "In
        my opinion...", "I'd say that...", "Personally, I think...".
        Согласие: "I couldn't agree more." Вежливое несогласие: "I see
        your point, but...", "I'm not so sure about that.". "Although"
        и "even though" + предложение (подлежащее + глагол). "Despite"
        и "in spite of" + существительное или -ing, а не целое
        предложение — частая ошибка ставить после них предложение так
        же, как после "although".

  - type: vocabulary
    order_index: 3
    content:
      items:
        - headword: "as far as I'm concerned"
          translation: "что касается меня, по моему мнению"
          example_sentence: "As far as I'm concerned, this is the right decision."
        - headword: "I couldn't agree more"
          translation: "полностью согласен"
          example_sentence: "I couldn't agree more with what you just said."
        - headword: "I see your point, but"
          translation: "понимаю твою точку зрения, но"
          example_sentence: "I see your point, but I still think it's risky."
        - headword: "on the other hand"
          translation: "с другой стороны"
          example_sentence: "It's expensive; on the other hand, it lasts for years."
        - headword: "to be honest"
          translation: "честно говоря"
          example_sentence: "To be honest, I don't think it's a good idea."
        - headword: "make a point"
          translation: "высказать/подчеркнуть мысль"
          example_sentence: "She made a good point about the budget."

  - type: grammar
    order_index: 4
    content:
      topics:
        - slug: concession-clauses
          title: "Contrasting ideas: although / even though / despite / in spite of"
          description: >
            "Although" and "even though" are followed by a full clause
            (subject + verb): "Although it was raining, we went for a
            walk." "Even though" is slightly stronger/more emphatic
            than "although" but works the same grammatically. "Despite"
            and "in spite of" are followed by a noun phrase or -ing
            form, never a full clause: "Despite the rain, we went for a
            walk." / "In spite of being tired, she finished the race."
            To turn a clause into a noun phrase after despite/in spite
            of, use "the fact that": "Despite the fact that it was
            raining, we went for a walk." Common mistake: "Despite it
            was raining..." — incorrect, needs "despite the rain" or
            "despite the fact that it was raining".

  - type: examples
    order_index: 5
    content:
      dialogues:
        - title: A discussion about remote work
          lines:
            - speaker: A
              text: "As far as I'm concerned, working from home is much more productive."
            - speaker: B
              text: "I see your point, but I think people miss out on real teamwork."
            - speaker: A
              text: "That's fair. Although I work from home, I do miss the office sometimes."
            - speaker: B
              text: "Exactly. Despite the convenience, something's missing."
            - speaker: A
              text: "To be honest, I couldn't agree more — a mix of both seems ideal."
            - speaker: B
              text: "On the other hand, not every job allows that kind of flexibility."

  - type: exercises
    order_index: 6
    content:
      items:
        - slug: expressing-opinions-mc-as-far-as
          type: multiple_choice
          skill: vocabulary
          difficulty: B1
          vocabulary_headword: "as far as I'm concerned"
          prompt:
            question: >-
              "As far as I'm concerned, this is the right decision"
              means...
            options:
              - id: a
                text: "In my personal opinion"
              - id: b
                text: "According to the official rules"
              - id: c
                text: "I don't have an opinion"
              - id: d
                text: "Someone else told me this"
          answer_key:
            correct_option_id: a
          explanation: >-
            "As far as I'm concerned" introduces a personal opinion, not
            an official fact or someone else's view.

        - slug: expressing-opinions-fill-concession-clauses
          type: fill_blank
          skill: grammar
          difficulty: B1
          grammar_topic_slug: concession-clauses
          prompt:
            text: >-
              Complete the sentences: 1) "___ it was expensive, we
              bought it." (subject + verb follows) (Although) 2) "___
              the price, we bought it." (noun follows) (Despite) 3)
              "She finished the race ___ being exhausted." (-ing
              follows) (in spite of)
          answer_key:
            blanks:
              - ["Although"]
              - ["Despite"]
              - ["in spite of"]
          explanation: >-
            "Although" is followed by a clause (subject + verb);
            "despite" and "in spite of" are followed by a noun or -ing
            form, not a full clause.

        - slug: expressing-opinions-order-couldnt-agree-more
          type: sentence_ordering
          skill: grammar
          difficulty: B1
          vocabulary_headword: "I couldn't agree more"
          prompt:
            words: ["agree", "I", "more", "couldn't"]
          answer_key:
            correct_order: ["I", "couldn't", "agree", "more"]
          explanation: >-
            Fixed phrase: subject ("I") + "couldn't" + "agree" +
            "more" — total agreement.

        - slug: expressing-opinions-reading-debate
          type: reading_comprehension
          skill: reading
          difficulty: B1
          prompt:
            passage: >-
              During the meeting, Sara argued that the company should
              switch to a four-day work week. "As far as I'm concerned,
              people would be more productive with an extra day to
              rest," she said. Tom disagreed. "I see your point, but I'm
              not so sure it would work for every team," he replied.
              Despite their different opinions, both agreed that the
              idea was worth discussing further. Although the meeting
              ended without a final decision, everyone made good points,
              and a second discussion was planned for the following
              week.
            questions:
              - id: q1
                text: "What did Sara argue for?"
                options:
                  - id: a
                    text: "A four-day work week"
                  - id: b
                    text: "Longer working hours"
                  - id: c
                    text: "Working from home"
                  - id: d
                    text: "Higher salaries"
              - id: q2
                text: "Did the meeting end with a final decision?"
                options:
                  - id: a
                    text: "Yes, everyone agreed immediately"
                  - id: b
                    text: "No, but they planned to discuss it again"
                  - id: c
                    text: "Yes, Tom's idea was chosen"
                  - id: d
                    text: "The text doesn't say"
          answer_key:
            answers:
              q1: a
              q2: b
          explanation: >-
            "Sara argued that the company should switch to a four-day
            work week" (Q1). "Although the meeting ended without a
            final decision... a second discussion was planned" (Q2).

        - slug: expressing-opinions-listening-2
          type: listening_comprehension
          skill: listening
          difficulty: B1
          prompt:
            # Same file as the lesson's own `listening` block below —
            # generate_audio.py only tracks/regenerates the `listening`
            # block's copy, not this one.
            audio_url: "/audio/expressing-opinions.mp3"
            transcript: >
              A: As far as I'm concerned, working from home is much more productive. —
              B: I see your point, but I think people miss out on real teamwork. — A:
              That's fair. Although I work from home, I do miss the office sometimes. —
              B: Exactly. Despite the convenience, something's missing. — A: To be
              honest, I couldn't agree more — a mix of both seems ideal. — B: On the
              other hand, not every job allows that kind of flexibility.
            questions:
              - id: q1
                text: "What does A think about working from home?"
                options:
                  - id: a
                    text: "It's more productive"
                  - id: b
                    text: "It's less productive"
                  - id: c
                    text: "It's boring"
                  - id: d
                    text: "We don't know"
              - id: q2
                text: "What solution do they agree seems ideal?"
                options:
                  - id: a
                    text: "A mix of both"
                  - id: b
                    text: "Full-time office work"
                  - id: c
                    text: "Full-time remote work"
                  - id: d
                    text: "We don't know"
              - id: q3
                text: "What does B point out at the end of the conversation?"
                options:
                  - id: a
                    text: "Not every job allows a flexible mix"
                  - id: b
                    text: "Everyone should work from home"
                  - id: c
                    text: "Offices should close entirely"
                  - id: d
                    text: "We don't know"
              - id: q4
                text: "What is B's main concern about working from home?"
                options:
                  - id: a
                    text: "People miss out on real teamwork"
                  - id: b
                    text: "It's too expensive"
                  - id: c
                    text: "It's less productive"
                  - id: d
                    text: "We don't know"
          answer_key:
            answers:
              q1: a
              q2: a
              q3: a
              q4: a
          explanation: >-
            "working from home is much more productive" (Q1); "a mix of both
            seems ideal" (Q2). "not every job allows that kind of flexibility"
            (Q3); "people miss out on real teamwork" (Q4).

  - type: reading
    order_index: 7
    content:
      title: A Discussion Worth Having
      text: >
        During the meeting, Sara argued that the company should switch
        to a four-day work week. "As far as I'm concerned, people would
        be more productive with an extra day to rest," she said. Tom
        disagreed. "I see your point, but I'm not so sure it would work
        for every team," he replied. Despite their different opinions,
        both agreed that the idea was worth discussing further. Although
        the meeting ended without a final decision, everyone made good
        points, and a second discussion was planned for the following
        week.
      summary_ru: >
        На встрече Сара предложила перейти на четырёхдневную рабочую
        неделю. «По моему мнению, люди были бы продуктивнее с
        дополнительным днём отдыха», — сказала она. Том не согласился.
        «Понимаю твою точку зрения, но не уверен, что это подойдёт
        каждой команде», — ответил он. Несмотря на разные мнения, оба
        согласились, что идею стоит обсудить подробнее. Хотя встреча
        закончилась без окончательного решения, все высказали хорошие
        мысли, и на следующую неделю запланировали второе обсуждение.

  - type: listening
    order_index: 8
    content:
      audio_url: "/audio/expressing-opinions.mp3"  # src-hash: 549f260c
      transcript: >
        A: As far as I'm concerned, working from home is much more
        productive. — B: I see your point, but I think people miss out
        on real teamwork. — A: That's fair. Although I work from home,
        I do miss the office sometimes. — B: Exactly. Despite the
        convenience, something's missing. — A: To be honest, I couldn't
        agree more — a mix of both seems ideal. — B: On the other hand,
        not every job allows that kind of flexibility.

  - type: speaking
    order_index: 9
    content:
      prompt: >
        Give your opinion on a topic you feel strongly about (e.g.
        working from home, social media, learning languages). Support
        it with a reason, and use "although" or "despite" at least once
        to acknowledge the other side. Speak for 60 seconds.

  - type: homework
    order_index: 10
    content:
      tasks:
        - type: writing
          instructions: >
            Write a short paragraph (6-8 sentences) giving your opinion
            on a topic, using at least 3 opinion phrases and 2
            contrast structures (although/despite/even though/in spite
            of).
        - type: vocabulary_recall
          instructions: >
            Without looking back at the lesson, write down as many
            opinion phrases as you remember, then check your list
            against the vocabulary block.
        - type: grammar_practice
          instructions: >
            Write 4 sentences contrasting two ideas — 2 with
            although/even though and 2 with despite/in spite of.

  - type: review
    order_index: 11
    content:
      note: >
        Review items for this lesson's vocabulary and the
        concession-clauses grammar topic are generated automatically
        from mistakes and spaced repetition — nothing to author here.

  - type: mini_test
    order_index: 12
    content:
      items:
        - slug: expressing-opinions-mini-mc-on-the-other-hand
          type: multiple_choice
          skill: vocabulary
          difficulty: B1
          vocabulary_headword: "on the other hand"
          prompt:
            question: "\"On the other hand\" is used to..."
            options:
              - id: a
                text: "Introduce a contrasting point"
              - id: b
                text: "Agree completely"
              - id: c
                text: "End a conversation"
              - id: d
                text: "Ask a question"
          answer_key:
            correct_option_id: a
          explanation: >-
            "On the other hand" introduces a contrasting or opposite
            point of view.

        - slug: expressing-opinions-mini-fill-concession-clauses-2
          type: fill_blank
          skill: grammar
          difficulty: B1
          grammar_topic_slug: concession-clauses
          prompt:
            text: >-
              Complete: 1) "___ he was tired, he kept working." (clause
              follows) (Although) 2) "She succeeded ___ the
              difficulties." (noun follows) (despite)
          answer_key:
            blanks:
              - ["Although"]
              - ["despite"]
          explanation: >-
            "Although" + clause; "despite" + noun phrase.

        - slug: expressing-opinions-mini-order-make-a-point
          type: sentence_ordering
          skill: grammar
          difficulty: B1
          vocabulary_headword: "make a point"
          prompt:
            words: ["good", "made", "a", "She", "point"]
          answer_key:
            correct_order: ["She", "made", "a", "good", "point"]
          explanation: >-
            Subject ("She") + verb ("made") + object ("a good point").

        - slug: expressing-opinions-mini-mc-to-be-honest
          type: multiple_choice
          skill: vocabulary
          difficulty: B1
          vocabulary_headword: "to be honest"
          prompt:
            question: "\"To be honest, I don't think it's a good idea\" is used to..."
            options:
              - id: a
                text: "Introduce a frank, sincere opinion"
              - id: b
                text: "Avoid giving an opinion"
              - id: c
                text: "Agree with someone politely"
              - id: d
                text: "Change the subject"
          answer_key:
            correct_option_id: a
          explanation: >-
            "To be honest" signals a frank, sincere opinion, even if
            it might be unwelcome.

        - slug: expressing-opinions-mini-reading-opinion
          type: reading_comprehension
          skill: reading
          difficulty: B1
          prompt:
            passage: >-
              Although the film was long, I really enjoyed it. Despite
              some slow moments, the ending made it worth watching.
            questions:
              - id: q1
                text: "Did the speaker enjoy the film?"
                options:
                  - id: a
                    text: "Yes"
                  - id: b
                    text: "No"
                  - id: c
                    text: "The text doesn't say"
          answer_key:
            answers:
              q1: a
          explanation: >-
            "I really enjoyed it" — despite the film being long with
            some slow moments.
