  - slug: final-exam-a2-translation-1
    type: translation
    skill: vocabulary
    difficulty: A2
    prompt:
      text: "Переведите на английский: «Я никогда не был в Лондоне»"
    answer_key:
      accepted: ["i have never been to london", "i've never been to london"]
    explanation: "«Я никогда не был в Лондоне» — \"I have never been to London\" (Present Perfect for experience)."

  - slug: final-exam-a2-translation-2
    type: translation
    skill: vocabulary
    difficulty: A2
    prompt:
      text: "Переведите на английский: «Мне нужно закончить эту работу к пятнице»"
    answer_key:
      accepted:
        - "i need to finish this work by friday"
        - "i have to finish this work by friday"
    explanation: "«Мне нужно закончить эту работу к пятнице» — \"I need to finish this work by Friday\"."

  # =====================================================================
