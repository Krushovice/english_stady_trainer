            - { id: c, text: "Went swimming instead" }
            - { id: d, text: "The text doesn't say" }
        - id: q2
          text: "Did they enjoy the trip?"
          options:
            - { id: a, text: "Yes, they had a great time" }
            - { id: b, text: "No, it was terrible" }
            - { id: c, text: "They left early" }
            - { id: d, text: "The text doesn't say" }
    answer_key:
      answers: { q1: a, q2: a }
    explanation: "\"They stayed in their tent and played cards\" (Q1); \"everyone had a great time\" (Q2)."

