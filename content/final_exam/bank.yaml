        - { id: c, text: "Do" }
        - { id: d, text: "Are" }
    answer_key: { correct_option_id: a }
    explanation: "Asking about life experience uses Present Perfect: \"Have you ever tried...?\"."

  - slug: final-exam-b1-grammar-2
    type: fill_blank
    skill: grammar
    difficulty: B1
    prompt:
      text: "This bridge ___ (build) in 1990."
    answer_key:
      blanks: [["was built"]]
    explanation: "The bridge didn't build itself — passive voice: \"was built\"."

  - slug: final-exam-b1-grammar-3
    type: multiple_choice
    skill: grammar
    difficulty: B1
    prompt:
      question: "If I ___ more free time, I would learn to paint."
      options:
        - { id: a, text: "have" }
