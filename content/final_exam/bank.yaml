# Course-wide final exam item bank — not tied to any lesson (lesson_id
# stays null, is_final_exam_item is set true by the loader). See
# app/schemas/content.py (FinalExamBankFile) and docs/decisions.md.
#
# 44 items, 11 per CEFR tier (A1/A2/B1/B2), ordered easy -> hard by
# CourseExamService. Deliberately unique content — never a question a
# learner has already seen in a lesson or the placement test — so passing
# the final exam can't be a matter of recognising familiar material.
#
# Per tier: 3 grammar, 2 vocabulary, 2 reading, 2 listening, 2 translation.
# Translation items are short phrases (Russian -> English), never full-text
# translation (that stays a homework task) — deterministic accepted-answer
# matching, same normalisation approach as fill_blank.
items:
  # =====================================================================
  # A1
  # =====================================================================
  - slug: final-exam-a1-grammar-1
    type: multiple_choice
    skill: grammar
    difficulty: A1
    prompt:
      question: "___ you a student?"
      options:
        - { id: a, text: "Am" }
        - { id: b, text: "Is" }
        - { id: c, text: "Are" }
        - { id: d, text: "Be" }
    answer_key: { correct_option_id: c }
    explanation: "\"You\" takes \"are\" in to-be questions."

  - slug: final-exam-a1-grammar-2
    type: fill_blank
    skill: grammar
    difficulty: A1
    prompt:
      text: "There ___ (be) a park near my house."
    answer_key:
      blanks: [["is"]]
    explanation: "Singular \"a park\" takes \"there is\", not \"there are\"."

  - slug: final-exam-a1-grammar-3
    type: multiple_choice
    skill: grammar
    difficulty: A1
    prompt:
      question: "Look! It ___ raining."
      options:
        - { id: a, text: "rain" }
        - { id: b, text: "rains" }
        - { id: c, text: "is raining" }
        - { id: d, text: "raining" }
    answer_key: { correct_option_id: c }
    explanation: "An action happening right now uses Present Continuous: \"is raining\"."

  - slug: final-exam-a1-vocabulary-1
    type: multiple_choice
    skill: vocabulary
    difficulty: A1
    prompt:
      question: "What do you call a place where you can borrow books?"
      options:
        - { id: a, text: "library" }
        - { id: b, text: "bakery" }
        - { id: c, text: "hospital" }
        - { id: d, text: "station" }
    answer_key: { correct_option_id: a }
    explanation: "A library lends books to visitors."

  - slug: final-exam-a1-vocabulary-2
    type: multiple_choice
    skill: vocabulary
    difficulty: A1
    prompt:
      question: "Which word means the opposite of \"expensive\"?"
      options:
        - { id: a, text: "cheap" }
        - { id: b, text: "heavy" }
        - { id: c, text: "quiet" }
        - { id: d, text: "fast" }
    answer_key: { correct_option_id: a }
    explanation: "\"Cheap\" means low in price — the opposite of \"expensive\"."

  - slug: final-exam-a1-reading-1
    type: reading_comprehension
    skill: reading
    difficulty: A1
    prompt:
      passage: >-
        Anna lives in a small flat in the city centre. She works in a café
        near her home, so she walks to work every morning. In the evening,
        she likes to cook dinner and watch TV.
      questions:
        - id: q1
          text: "Where does Anna work?"
          options:
            - { id: a, text: "In a café" }
            - { id: b, text: "In a library" }
            - { id: c, text: "In a school" }
            - { id: d, text: "The text doesn't say" }
        - id: q2
          text: "How does she get to work?"
          options:
            - { id: a, text: "She walks" }
            - { id: b, text: "She drives" }
            - { id: c, text: "She takes the bus" }
            - { id: d, text: "The text doesn't say" }
    answer_key:
      answers: { q1: a, q2: a }
    explanation: "\"She works in a café\" (Q1); \"she walks to work every morning\" (Q2)."

  - slug: final-exam-a1-reading-2
    type: reading_comprehension
    skill: reading
    difficulty: A1
    prompt:
      passage: >-
        Tom has a dog called Max. Every weekend, they go to the park
        together. Max loves to run and play with other dogs there.
      questions:
        - id: q1
          text: "What is the dog's name?"
          options:
            - { id: a, text: "Max" }
            - { id: b, text: "Tom" }
            - { id: c, text: "Rex" }
            - { id: d, text: "The text doesn't say" }
        - id: q2
          text: "When do they go to the park?"
          options:
            - { id: a, text: "Every weekend" }
            - { id: b, text: "Every morning" }
            - { id: c, text: "Once a month" }
            - { id: d, text: "The text doesn't say" }
    answer_key:
      answers: { q1: a, q2: a }
    explanation: "\"Tom has a dog called Max\" (Q1); \"Every weekend, they go to the park\" (Q2)."

  - slug: final-exam-a1-listening-1
    type: listening_comprehension
    skill: listening
    difficulty: A1
    prompt:
      audio_url: "/audio/final-exam-a1-listening-1.mp3"  # src-hash: 2f55bc1a
      transcript: >
        A: Excuse me, is this seat free? — B: Yes, please sit down. — A:
        Thank you. Are you going to the station too? — B: Yes, I am. My
        train leaves at ten.
      questions:
        - id: q1
          text: "What does A ask about?"
          options:
            - { id: a, text: "The seat" }
            - { id: b, text: "The train time" }
            - { id: c, text: "The ticket price" }
            - { id: d, text: "We don't know" }
        - id: q2
          text: "When does B's train leave?"
          options:
            - { id: a, text: "At ten" }
            - { id: b, text: "At nine" }
            - { id: c, text: "At eleven" }
            - { id: d, text: "We don't know" }
    answer_key:
      answers: { q1: a, q2: a }
    explanation: "\"Is this seat free?\" (Q1); \"My train leaves at ten\" (Q2)."

  - slug: final-exam-a1-listening-2
    type: listening_comprehension
    skill: listening
    difficulty: A1
    prompt:
      audio_url: "/audio/final-exam-a1-listening-2.mp3"  # src-hash: b2d0e2c2
      transcript: >
        A: What's your favourite food? — B: I really like pizza. What
        about you? — A: I prefer pasta, actually. — B: Oh, we should try
        that new Italian restaurant.
      questions:
        - id: q1
          text: "What food does B like?"
          options:
            - { id: a, text: "Pizza" }
            - { id: b, text: "Pasta" }
            - { id: c, text: "Salad" }
            - { id: d, text: "We don't know" }
        - id: q2
          text: "What does A prefer?"
          options:
            - { id: a, text: "Pasta" }
            - { id: b, text: "Pizza" }
            - { id: c, text: "Soup" }
            - { id: d, text: "We don't know" }
    answer_key:
      answers: { q1: a, q2: a }
    explanation: "\"I really like pizza\" (Q1); \"I prefer pasta, actually\" (Q2)."

  - slug: final-exam-a1-translation-1
    type: translation
    skill: vocabulary
    difficulty: A1
    prompt:
      text: "Переведите на английский: «Сколько это стоит?»"
    answer_key:
      accepted: ["how much is it", "how much does it cost"]
    explanation: "«Сколько это стоит?» — \"How much is it?\" or \"How much does it cost?\"."

  - slug: final-exam-a1-translation-2
    type: translation
    skill: vocabulary
    difficulty: A1
    prompt:
      text: "Переведите на английский: «Я не понимаю»"
    answer_key:
      accepted: ["i don't understand", "i do not understand"]
    explanation: "«Я не понимаю» — \"I don't understand\"."

  # =====================================================================
  # A2
  # =====================================================================
  - slug: final-exam-a2-grammar-1
    type: multiple_choice
    skill: grammar
    difficulty: A2
    prompt:
      question: "She ___ to Paris last summer."
      options:
        - { id: a, text: "go" }
        - { id: b, text: "goes" }
        - { id: c, text: "went" }
        - { id: d, text: "going" }
    answer_key: { correct_option_id: c }
    explanation: "\"Last summer\" needs Past Simple: \"went\" (irregular past of \"go\")."

  - slug: final-exam-a2-grammar-2
    type: fill_blank
    skill: grammar
    difficulty: A2
    prompt:
      text: "This road is ___ (busy) than that one."
    answer_key:
      blanks: [["busier"]]
    explanation: "Short adjectives form comparatives with \"-er\": \"busy\" -> \"busier\"."

  - slug: final-exam-a2-grammar-3
    type: multiple_choice
    skill: grammar
    difficulty: A2
    prompt:
      question: "Look at those clouds! It ___ rain soon."
      options:
        - { id: a, text: "is going to" }
        - { id: b, text: "will" }
        - { id: c, text: "is" }
        - { id: d, text: "was" }
    answer_key: { correct_option_id: a }
    explanation: "A prediction based on present evidence (dark clouds) uses \"going to\", not \"will\"."

  - slug: final-exam-a2-vocabulary-1
