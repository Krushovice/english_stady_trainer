        always seems to get away with being late himself. — A: Ha, to
        be fair, that happens everywhere. — B: True. Anyway, basically,
        I've learnt to put up with the small stuff and focus on the
        good.

  - type: speaking
    order_index: 9
    content:
      prompt: >
        Talk casually about your job, studies or daily life, deliberately
        using at least three discourse markers (well, I mean, you know,
        anyway, basically, to be fair) and one three-part phrasal verb.
        Speak for 60 seconds.

  - type: homework
    order_index: 10
    content:
      tasks:
        - type: writing
          instructions: >
            Write a casual, natural-sounding dialogue (8-10 lines)
            between two friends, using at least 4 discourse markers and
            2 three-part phrasal verbs.
        - type: vocabulary_recall
          instructions: >
            Without looking back at the lesson, write down as many
            discourse markers and phrasal verbs as you remember, then
            check your list against the vocabulary block.
        - type: grammar_practice
          instructions: >
            Write 6 sentences using a different three-part phrasal verb
            in each (put up with, look forward to, come up with, get
            away with, look down on, and one more of your choice).

  - type: review
    order_index: 11
    content:
      note: >
        Review items for this lesson's vocabulary and the
        discourse-markers-phrasal-verbs grammar topic are generated
        automatically from mistakes and spaced repetition — nothing to
        author here.

  - type: mini_test
    order_index: 12
    content:
      items:
        - slug: talking-naturally-mini-mc-basically
          type: multiple_choice
          skill: vocabulary
          difficulty: B2
          vocabulary_headword: "basically"
          prompt:
            question: "\"Basically, we just need more time\" is used to..."
            options:
              - id: a
                text: "Simplify or summarise the main point"
              - id: b
                text: "Add a complicated new detail"
              - id: c
                text: "Contradict what was said before"
              - id: d
                text: "Ask a question"
          answer_key:
            correct_option_id: a
          explanation: >-
            "Basically" introduces a simplified summary of the main
            point.

        - slug: talking-naturally-mini-fill-discourse-markers-2
          type: fill_blank
          skill: grammar
          difficulty: B2
          grammar_topic_slug: discourse-markers-phrasal-verbs
          prompt:
            text: >-
              Complete: 1) "I'm really ___ ___ ___ the weekend." (look
              forward to) 2) "They ___ ___ ___ a great solution." (came
              up with)
          answer_key:
            blanks:
              - ["looking forward to"]
              - ["came up with"]
          explanation: >-
            "Look forward to" (anticipate happily); "come up with"
            (invent/produce) — both fixed three-part phrasal verbs.

        - slug: talking-naturally-mini-order-get-away-with
          type: sentence_ordering
          skill: grammar
          difficulty: B2
          vocabulary_headword: "get away with"
          prompt:
            words: ["late", "gets", "He", "with", "away", "being", "always"]
          answer_key:
            correct_order: ["He", "always", "gets", "away", "with", "being", "late"]
          explanation: >-
            "Get away with" + gerund: "gets away with being late" —
            avoids consequences for something.

        - slug: talking-naturally-mini-mc-look-down-on
          type: multiple_choice
          skill: vocabulary
          difficulty: B2
          vocabulary_headword: "look down on"
          prompt:
            question: "\"She never looks down on anyone\" means..."
            options:
              - id: a
                text: "She never treats people as inferior"
              - id: b
                text: "She never looks at people directly"
              - id: c
                text: "She avoids everyone"
              - id: d
                text: "She always agrees with everyone"
          answer_key:
            correct_option_id: a
          explanation: >-
            "Look down on" means to consider someone inferior or less
            important.

        - slug: talking-naturally-mini-reading-discourse
          type: reading_comprehension
          skill: reading
          difficulty: B2
          prompt:
            passage: >-
              Well, to be fair, it wasn't a perfect plan. Basically, we
              just ran out of time to prepare properly.
            questions:
              - id: q1
                text: "Why does the speaker say the plan wasn't perfect?"
                options:
                  - id: a
                    text: "They ran out of time to prepare"
                  - id: b
                    text: "Nobody wanted to help"
                  - id: c
                    text: "It was too expensive"
          answer_key:
            answers:
              q1: a
          explanation: >-
            "Basically, we just ran out of time to prepare properly."
