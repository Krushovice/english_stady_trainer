  - type: speaking
    order_index: 9
    content:
      prompt: >
        Tell a dramatic or surprising story from your own life. Use at
        least two inversion structures (never have I, not only, little
        did I know, rarely) for emphasis. Speak for 60 seconds.

  - type: homework
    order_index: 10
    content:
      tasks:
        - type: writing
          instructions: >
            Write a short dramatic story (8-10 sentences), using
            inversion for emphasis at least 3 times.
        - type: vocabulary_recall
          instructions: >
            Without looking back at the lesson, write down as many
            storytelling expressions as you remember, then check your
            list against the vocabulary block.
        - type: grammar_practice
          instructions: >
            Rewrite 5 plain sentences using inversion for emphasis
            (never, not only, little, rarely, no sooner).

  - type: review
    order_index: 11
    content:
      note: >
        Review items for this lesson's vocabulary and the
        inversion-emphasis grammar topic are generated automatically
        from mistakes and spaced repetition — nothing to author here.

  - type: mini_test
    order_index: 12
    content:
      items:
        - slug: advanced-storytelling-mini-mc-against-all-odds
          type: multiple_choice
          skill: vocabulary
          difficulty: B2
          vocabulary_headword: "against all odds"
          prompt:
            question: "\"Against all odds, they finished the project on time\" means..."
            options:
              - id: a
                text: "Despite very unlikely chances of success"
              - id: b
                text: "Because it was very easy"
              - id: c
                text: "With plenty of extra time to spare"
              - id: d
                text: "They didn't finish on time"
          answer_key:
            correct_option_id: a
          explanation: >-
            "Against all odds" means despite very low chances of
            success.

        - slug: advanced-storytelling-mini-fill-inversion-emphasis-2
          type: fill_blank
          skill: grammar
          difficulty: B2
          grammar_topic_slug: inversion-emphasis
          prompt:
            text: >-
              Rewrite: 1) "We had no sooner sat down than the phone
              rang." -> "No sooner ___ we sat down than the phone
              rang." (had) 2) "I have rarely felt so proud." -> "Rarely
              ___ I felt so proud." (have)
          answer_key:
            blanks:
              - ["had"]
              - ["have"]
          explanation: >-
            Inversion after "no sooner" and "rarely" — auxiliary before
            subject.

        - slug: advanced-storytelling-mini-order-nick-of-time
          type: sentence_ordering
          skill: grammar
          difficulty: B2
          vocabulary_headword: "in the nick of time"
          prompt:
            words: ["nick", "the", "caught", "train", "the", "We", "in", "of", "time"]
          answer_key:
            correct_order: ["We", "caught", "the", "train", "in", "the", "nick", "of", "time"]
          explanation: >-
            "In the nick of time" — at the very last possible moment.

        - slug: advanced-storytelling-mini-mc-twist
          type: multiple_choice
          skill: vocabulary
          difficulty: B2
          vocabulary_headword: "a twist"
          prompt:
            question: "A \"twist\" in a story is..."
            options:
              - id: a
                text: "An unexpected turn of events"
              - id: b
                text: "A predictable, boring ending"
              - id: c
                text: "The beginning of the story"
              - id: d
                text: "A character's name"
          answer_key:
            correct_option_id: a
          explanation: >-
            A "twist" is a surprising, unexpected turn in a story.

        - slug: advanced-storytelling-mini-reading-inversion
          type: reading_comprehension
          skill: reading
          difficulty: B2
          prompt:
            passage: >-
              Never had she felt so relieved. Against all odds, the
              rescue team arrived just in the nick of time.
            questions:
              - id: q1
                text: "How did she feel?"
                options:
                  - id: a
                    text: "Relieved"
                  - id: b
                    text: "Angry"
                  - id: c
                    text: "Bored"
          answer_key:
            answers:
              q1: a
          explanation: >-
            "Never had she felt so relieved."
