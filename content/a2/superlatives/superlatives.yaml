level:
  code: A2
  order_index: 1

module:
  slug: superlatives
  title: Superlatives
  order_index: 8

lesson:
  slug: superlatives
  title: Superlatives
  order_index: 1

blocks:
  - type: learning_goals
    order_index: 1
    content:
      goals:
        - "Сравнить три и более предметов или людей между собой"
        - "Правильно образовать превосходную степень прилагательных"
        - "Использовать превосходную степень в реальных ситуациях (лучший ресторан, самый быстрый способ)"
        - "Использовать 8 новых слов-прилагательных для описания качества"

  - type: context
    order_index: 2
    content:
      text: >
        Превосходная степень (superlative) сравнивает один предмет со
        всеми остальными в группе: "the biggest city", "the most
        expensive restaurant". Короткие прилагательные (1 слог, иногда
        2) получают окончание -est: big -> the biggest, cheap -> the
        cheapest. Прилагательные с 2+ слогами используют "the most" +
        прилагательное: expensive -> the most expensive, comfortable ->
        the most comfortable. Есть исключения: good -> the best, bad ->
        the worst, far -> the furthest. Всегда используется артикль
        "the" перед превосходной степенью.

  - type: vocabulary
    order_index: 3
    content:
      items:
        - headword: "popular / famous"
          translation: "популярный / известный"
          example_sentence: "This is the most popular restaurant in the city."
        - headword: "reliable"
          translation: "надёжный"
          example_sentence: "This is the most reliable brand I know."
        - headword: "convenient"
          translation: "удобный, практичный"
          example_sentence: "The metro is the most convenient way to travel."
        - headword: "worth it"
          translation: "стоит того"
          example_sentence: "It's expensive, but it's worth it."
        - headword: "value for money"
          translation: "соотношение цены и качества"
          example_sentence: "This hotel offers good value for money."
        - headword: "overrated / underrated"
          translation: "переоценённый / недооценённый"
          example_sentence: "I think this café is a bit overrated."
        - headword: "impressive"
          translation: "впечатляющий"
          example_sentence: "The view from the top was really impressive."
        - headword: "in my opinion"
          translation: "по моему мнению"
          example_sentence: "In my opinion, this is the best café in town."

  - type: grammar
    order_index: 4
    content:
      topics:
        - slug: superlatives
          title: "Superlative adjectives"
          description: >
            Короткие прилагательные (1 слог) + -est: fast -> the
            fastest, cheap -> the cheapest. Если прилагательное
            заканчивается на -y, -y меняется на -iest: busy -> the
            busiest, easy -> the easiest. Длинные прилагательные (2+
            слога, кроме -y) — "the most" + прилагательное: expensive ->
            the most expensive, interesting -> the most interesting.
            Исключения: good -> the best, bad -> the worst, far -> the
            furthest/farthest. Всегда с артиклем "the": "This is the
            best restaurant in town." Частая ошибка — добавлять и -est,
            и "most" одновременно ("the most fastest" — неправильно,
            нужно просто "the fastest").

  - type: examples
    order_index: 5
    content:
      dialogues:
        - title: Choosing a restaurant
          lines:
            - speaker: A
              text: "Which restaurant do you recommend? There are so many here."
            - speaker: B
              text: "In my opinion, this one is the best — it's not the cheapest, but it's the most reliable."
            - speaker: A
              text: "Is it the most popular one too?"
            - speaker: B
              text: "Yes, and honestly, it's the most convenient — it's the closest to the hotel."
            - speaker: A
              text: "Sounds worth it. Is it the most expensive option?"
            - speaker: B
              text: "No, actually it offers the best value for money of all of them."

  - type: exercises
    order_index: 6
    content:
      items:
        - slug: superlatives-mc-reliable
          type: multiple_choice
          skill: vocabulary
          difficulty: A2
          vocabulary_headword: "reliable"
          prompt:
            question: >-
              What does "reliable" mean?
            options:
              - id: a
                text: "Something you can trust to work well every time"
              - id: b
                text: "Something very cheap"
              - id: c
                text: "Something old and broken"
              - id: d
                text: "Something loud and popular"
          answer_key:
            correct_option_id: a
          explanation: >-
            "Reliable" — надёжный, то, на что можно положиться.

        - slug: superlatives-fill-superlatives
          type: fill_blank
          skill: grammar
          difficulty: A2
          grammar_topic_slug: superlatives
          prompt:
            text: >-
              Заполните превосходную степень: 1) "This is ___ ___ (fast)
              way to get there." (the fastest) 2) "It's ___ ___
              (expensive) restaurant in town." (the most expensive) 3)
              "That was ___ ___ (bad) film I've ever seen." (the worst)
          answer_key:
            blanks:
              - ["the fastest"]
              - ["the most expensive"]
              - ["the worst"]
          explanation: >-
            Короткое прилагательное + -est (the fastest); длинное — "the
            most" + прилагательное (the most expensive); исключение —
            bad -> the worst.

        - slug: superlatives-order-value-for-money
          type: sentence_ordering
          skill: grammar
          difficulty: A2
          vocabulary_headword: "value for money"
          prompt:
            words: ["best", "This", "offers", "value", "the", "for", "hotel", "money"]
          answer_key:
            correct_order: ["This", "hotel", "offers", "the", "best", "value", "for", "money"]
          explanation: >-
            Подлежащее ("This hotel") + глагол ("offers") + превосходная
            степень + дополнение ("the best value for money").

        - slug: superlatives-reading-city-guide
          type: reading_comprehension
          skill: reading
          difficulty: A2
          prompt:
            passage: >-
              According to the city guide, the oldest building in town is
              the cathedral, built over 500 years ago. The most popular
              attraction, however, is the new science museum, which gets
              the most visitors every year. Locals say the busiest time
              to visit is in summer, but the cheapest tickets are
              available in winter. In their opinion, the museum is the
              most impressive place in the whole city, even though it's
              not the oldest.
            questions:
              - id: q1
                text: "What is the oldest building in town?"
                options:
                  - id: a
                    text: "The science museum"
                  - id: b
                    text: "The cathedral"
                  - id: c
                    text: "The city hall"
                  - id: d
                    text: "The train station"
              - id: q2
                text: "When are the cheapest tickets available?"
                options:
                  - id: a
                    text: "In summer"
                  - id: b
                    text: "In winter"
                  - id: c
                    text: "All year round"
                  - id: d
                    text: "The text doesn't say"
          answer_key:
            answers:
              q1: b
              q2: b
          explanation: >-
            "The oldest building in town is the cathedral" (Q1). "The
            cheapest tickets are available in winter" (Q2).

  - type: reading
    order_index: 7
    content:
      title: The City's Best Attractions
      text: >
        According to the city guide, the oldest building in town is the
        cathedral, built over 500 years ago. The most popular attraction,
        however, is the new science museum, which gets the most visitors
        every year. Locals say the busiest time to visit is in summer,
        but the cheapest tickets are available in winter. In their
        opinion, the museum is the most impressive place in the whole
        city, even though it's not the oldest.
      summary_ru: >
        Согласно путеводителю, самое старое здание в городе — собор,
        построенный более 500 лет назад. Однако самая популярная
        достопримечательность — новый научный музей, который каждый год
        собирает больше всего посетителей. Местные говорят, что самое
        оживлённое время для посещения — лето, а самые дешёвые билеты
        доступны зимой. По их мнению, музей — самое впечатляющее место
        во всём городе, хотя он и не самый старый.

  - type: listening
    order_index: 8
    content:
      note: "Аудиозапись появится позже — пока нет пайплайна для аудио (Phase 5/6)."
      transcript: >
        A: Which restaurant do you recommend? There are so many here. —
        B: In my opinion, this one is the best — it's not the cheapest,
        but it's the most reliable. — A: Is it the most popular one too?
        — B: Yes, and honestly, it's the most convenient — it's the
        closest to the hotel. — A: Sounds worth it. Is it the most
        expensive option? — B: No, actually it offers the best value for
        money of all of them.

  - type: speaking
    order_index: 9
    content:
      prompt: >
        Расскажите о самом лучшем/худшем месте, где вы были (ресторан,
        город, отель). Используйте минимум три превосходные степени.
        Говорите 40-60 секунд.

  - type: homework
    order_index: 10
    content:
      tasks:
        - type: writing
          instructions: >
            Напишите 5-6 предложений о самом интересном месте в вашем
            городе, используя превосходную степень.
        - type: vocabulary_recall
          instructions: >
            Не заглядывая в урок, запишите как можно больше слов-
            прилагательных для описания качества, затем сверьте список
            со словарным блоком.
        - type: grammar_practice
          instructions: >
            Напишите 5 предложений с превосходной степенью о своей
            семье, друзьях или городе (the tallest, the funniest, the
            most interesting...).

  - type: review
    order_index: 11
    content:
      note: >
        Review items for this lesson's vocabulary and the superlatives
        grammar topic are generated automatically from mistakes and
        spaced repetition — nothing to author here.

  - type: mini_test
    order_index: 12
    content:
      items:
        - slug: superlatives-mini-mc-convenient
          type: multiple_choice
          skill: vocabulary
          difficulty: A2
          vocabulary_headword: "convenient"
          prompt:
            question: "\"The metro is the most convenient way to travel\" means..."
            options:
              - id: a
                text: "It's the easiest and most practical way"
              - id: b
                text: "It's the most expensive way"
              - id: c
                text: "It's the slowest way"
              - id: d
                text: "It's the least popular way"
          answer_key:
            correct_option_id: a
          explanation: >-
            "Convenient" — удобный, практичный, простой в использовании.

        - slug: superlatives-mini-fill-superlatives-2
          type: fill_blank
          skill: grammar
          difficulty: A2
          grammar_topic_slug: superlatives
          prompt:
            text: >-
              Заполните превосходную степень: 1) "She's ___ ___
              (friendly) person I know." (the friendliest) 2) "This is
              ___ ___ (good) coffee in the city." (the best)
          answer_key:
            blanks:
              - ["the friendliest"]
              - ["the best"]
          explanation: >-
            "Friendly" заканчивается на -y -> "the friendliest";
            исключение "good" -> "the best".

        - slug: superlatives-mini-order-impressive
          type: sentence_ordering
          skill: grammar
          difficulty: A2
          vocabulary_headword: "impressive"
          prompt:
            words: ["was", "impressive", "The", "most", "view", "the"]
          answer_key:
            correct_order: ["The", "view", "was", "the", "most", "impressive"]
          explanation: >-
            Подлежащее ("The view") + глагол ("was") + превосходная
            степень ("the most impressive").

        - slug: superlatives-mini-mc-overrated
          type: multiple_choice
          skill: vocabulary
          difficulty: A2
          vocabulary_headword: "overrated / underrated"
          prompt:
            question: "If a place is \"overrated\", it means..."
            options:
              - id: a
                text: "People think it's better than it really is"
              - id: b
                text: "It's not popular at all"
              - id: c
                text: "It's the cheapest option"
              - id: d
                text: "Nobody has heard of it"
          answer_key:
            correct_option_id: a
          explanation: >-
            "Overrated" — переоценённый, люди считают это лучше, чем
            есть на самом деле.

        - slug: superlatives-mini-reading-best-cafe
          type: reading_comprehension
          skill: reading
          difficulty: A2
          prompt:
            passage: >-
              In my opinion, this is the best café in town. It's not the
              cheapest, but it has the friendliest staff and the most
              comfortable chairs.
            questions:
              - id: q1
                text: "Is this café the cheapest in town?"
                options:
                  - id: a
                    text: "Yes"
                  - id: b
                    text: "No"
                  - id: c
                    text: "The text doesn't say"
          answer_key:
            answers:
              q1: b
          explanation: >-
            "It's not the cheapest, but it has the friendliest staff..."
