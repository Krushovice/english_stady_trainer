level:
  code: A2
  order_index: 1

module:
  slug: ordering-food
  title: Ordering Food
  order_index: 1

lesson:
  slug: ordering-food
  title: Ordering Food
  order_index: 1

blocks:
  - type: learning_goals
    order_index: 1
    content:
      goals:
        - "Заказать еду и напитки в кафе или ресторане"
        - "Вежливо попросить что-то, используя Could I have / I'd like"
        - "Спросить про состав блюда и особые пожелания (без лука, без сахара)"
        - "Использовать 8 новых слов по теме еды вне дома"

  - type: context
    order_index: 2
    content:
      text: >
        В кафе и ресторанах заказ обычно делают вежливыми фразами: "Could I
        have...?", "I'd like...", "Can I get...?" — это более вежливо и
        естественно, чем просто "Give me...". Официант часто спрашивает:
        "Anything else?", "For here or to go?", "How would you like your
        steak?". Если нужно что-то изменить в заказе (без лука, без сахара,
        побольше льда), используют "without", "no", "with extra...".

  - type: vocabulary
    order_index: 3
    content:
      items:
        - headword: "could I have"
          translation: "могу я взять / дайте мне, пожалуйста"
          example_sentence: "Could I have a cup of coffee and a sandwich, please?"
        - headword: "for here or to go"
          translation: "здесь или с собой"
          example_sentence: "Is that for here or to go?"
        - headword: "starter / main course / dessert"
          translation: "закуска / основное блюдо / десерт"
          example_sentence: "I'll have soup as a starter and pasta as a main course."
        - headword: "waiter / waitress"
          translation: "официант / официантка"
          example_sentence: "The waiter recommended the fish."
        - headword: "menu"
          translation: "меню"
          example_sentence: "Can I see the menu, please?"
        - headword: "bill / check"
          translation: "счёт"
          example_sentence: "Could we have the bill, please?"
        - headword: "without"
          translation: "без"
          example_sentence: "A burger without onions, please."
        - headword: "recommend"
          translation: "рекомендовать"
          example_sentence: "What do you recommend?"

  - type: grammar
    order_index: 4
    content:
      topics:
        - slug: polite-requests
          title: "Polite requests: Could I have / I'd like / Can I get"
          description: >
            Для вежливой просьбы в кафе или магазине используют "Could I
            have + существительное?", "I'd like + существительное" ("I'd
            like a coffee, please"), или разговорное "Can I get...?". Ответ
            на такую просьбу: "Sure, anything else?" или "Here you go".
            Отличие от прямого "Give me a coffee" — вежливые формы звучат
            естественнее и их всегда используют с посторонними людьми, а не
            только "please" в конце.

  - type: examples
    order_index: 5
    content:
      dialogues:
        - title: At the restaurant
          lines:
            - speaker: A
              text: "Hi, could I have the menu, please?"
            - speaker: B
              text: "Of course. Here you go. Can I get you something to drink?"
            - speaker: A
              text: "I'd like a lemonade, please. And what do you recommend as a main course?"
            - speaker: B
              text: "The chicken is very popular. Would you like it with or without rice?"
            - speaker: A
              text: "With rice, please. And could I have it without onions?"
            - speaker: B
              text: "No problem. Anything else?"
            - speaker: A
              text: "Just the bill at the end, thanks."

  - type: exercises
    order_index: 6
    content:
      items:
        - slug: ordering-food-mc-bill
          type: multiple_choice
          skill: vocabulary
          difficulty: A2
          vocabulary_headword: "bill / check"
          prompt:
            question: >-
              Вы закончили есть и хотите заплатить. Что вы скажете официанту?
            options:
              - id: a
                text: "Could we have the bill, please?"
              - id: b
                text: "Could we have the menu, please?"
              - id: c
                text: "For here or to go?"
              - id: d
                text: "What do you recommend?"
          answer_key:
            correct_option_id: a
          explanation: >-
            Чтобы попросить счёт, говорят "Could we have the bill, please?" —
            меню просят до заказа, а не после еды.

        - slug: ordering-food-fill-polite-requests
          type: fill_blank
          skill: grammar
          difficulty: A2
          grammar_topic_slug: polite-requests
          prompt:
            text: >-
              Перепишите вежливо: 1) "Give me a coffee." -> "___ ___ a
              coffee, please?" (Could I have) 2) "I want the chicken." ->
              "I'd ___ the chicken, please." (like) 3) "Give me the bill."
              -> "___ ___ have the bill, please?" (Could we)
          answer_key:
            blanks:
              - ["Could I have"]
              - ["like"]
              - ["Could we"]
          explanation: >-
            "Give me..." звучит грубо; вежливые формы — "Could I have...?",
            "I'd like...", "Could we have...?".

        - slug: ordering-food-order-without-onions
          type: sentence_ordering
          skill: grammar
          difficulty: A2
          vocabulary_headword: "without"
          prompt:
            words: ["without", "have", "burger", "Could", "onions", "a", "I"]
          answer_key:
            correct_order: ["Could", "I", "have", "a", "burger", "without", "onions"]
          explanation: >-
            Вежливая просьба + существительное + уточнение "without
            onions" в конце: "Could I have a burger without onions?"

        - slug: ordering-food-reading-cafe
          type: reading_comprehension
          skill: reading
          difficulty: A2
          prompt:
            passage: >-
              Maria went to a small café for lunch. The waiter gave her the
              menu and recommended the soup of the day. She ordered soup as
              a starter and a chicken salad as a main course, without
              cheese because she doesn't eat dairy. When she finished, she
              asked for the bill and paid by card. The food was for here,
              not to go — she wanted to relax and read her book.
            questions:
              - id: q1
                text: "What did the waiter recommend?"
                options:
                  - id: a
                    text: "The chicken salad"
                  - id: b
                    text: "The soup of the day"
                  - id: c
                    text: "The bill"
                  - id: d
                    text: "A dessert"
              - id: q2
                text: "Why did Maria order the salad without cheese?"
                options:
                  - id: a
                    text: "She doesn't like salad"
                  - id: b
                    text: "She doesn't eat dairy"
                  - id: c
                    text: "It was too expensive"
                  - id: d
                    text: "The café didn't have cheese"
              - id: q3
                text: "Did Maria take her food to go?"
                options:
                  - id: a
                    text: "Yes, she was in a hurry"
                  - id: b
                    text: "No, she ate at the café"
                  - id: c
                    text: "We don't know"
                  - id: d
                    text: "She ordered it for a friend"
          answer_key:
            answers:
              q1: b
              q2: b
              q3: b
          explanation: >-
            "The waiter... recommended the soup of the day" (Q1). "Without
            cheese because she doesn't eat dairy" (Q2). "The food was for
            here, not to go" (Q3).

        - slug: ordering-food-listening-restaurant
          type: listening_comprehension
          skill: listening
          difficulty: A2
          prompt:
            # Same file as the lesson's own `listening` block below —
            # generate_audio.py only tracks/regenerates the `listening`
            # block's copy, not this one.
            audio_url: "/audio/ordering-food.mp3"
            transcript: >
              A: Hi, could I have the menu, please? — B: Of course. Here you go.
              Can I get you something to drink? — A: I'd like a lemonade,
              please. And what do you recommend as a main course? — B: The
              chicken is very popular. Would you like it with or without rice?
              — A: With rice, please. And could I have it without onions? — B:
              No problem. Anything else? — A: Just the bill at the end, thanks.
            questions:
              - id: q1
                text: "What does A want to drink?"
                options:
                  - id: a
                    text: "Lemonade"
                  - id: b
                    text: "Water"
                  - id: c
                    text: "Coffee"
                  - id: d
                    text: "Juice"
              - id: q2
                text: "How does A want the chicken?"
                options:
                  - id: a
                    text: "With rice, without onions"
                  - id: b
                    text: "Without rice, with onions"
                  - id: c
                    text: "With rice and onions"
                  - id: d
                    text: "Without rice or onions"
          answer_key:
            answers:
              q1: a
              q2: a
          explanation: >-
            "I'd like a lemonade" (Q1 — lemonade); "With rice, please. And could I have it without onions?" (Q2 — with rice, without onions).

  - type: reading
    order_index: 7
    content:
      title: Lunch at the Café
      text: >
        Maria went to a small café for lunch. The waiter gave her the menu
        and recommended the soup of the day. She ordered soup as a starter
        and a chicken salad as a main course, without cheese because she
        doesn't eat dairy. When she finished, she asked for the bill and
        paid by card. The food was for here, not to go — she wanted to
        relax and read her book.
      summary_ru: >
        Мария пришла в небольшое кафе на обед. Официант дал ей меню и
        порекомендовал суп дня. Она заказала суп как закуску и куриный
        салат как основное блюдо, без сыра, потому что не ест молочное.
        Закончив, она попросила счёт и оплатила картой. Она ела в кафе, а
        не брала с собой — хотела отдохнуть и почитать книгу.

  - type: listening
    order_index: 8
    content:
      audio_url: "/audio/ordering-food.mp3"  # src-hash: 063b1611
      transcript: >
        A: Hi, could I have the menu, please? — B: Of course. Here you go.
        Can I get you something to drink? — A: I'd like a lemonade,
        please. And what do you recommend as a main course? — B: The
        chicken is very popular. Would you like it with or without rice?
        — A: With rice, please. And could I have it without onions? — B:
        No problem. Anything else? — A: Just the bill at the end, thanks.

  - type: speaking
    order_index: 9
    content:
      prompt: >
        Представьте, что вы в ресторане. Закажите закуску, основное блюдо
        и напиток, попросите что-то без одного из ингредиентов и в конце
        попросите счёт. Говорите 40-60 секунд.

  - type: homework
    order_index: 10
    content:
      tasks:
        - type: writing
          instructions: >
            Напишите короткий диалог (6-8 реплик) между официантом и
            посетителем в кафе, используя минимум 4 слова из этого урока.
        - type: vocabulary_recall
          instructions: >
            Не заглядывая в урок, запишите как можно больше слов по теме
            заказа еды, затем сверьте список со словарным блоком.
        - type: grammar_practice
          instructions: >
            Напишите 5 вежливых просьб в кафе, используя "Could I have"
            или "I'd like".

  - type: review
    order_index: 11
    content:
      note: >
        Review items for this lesson's vocabulary and the polite-requests
        grammar topic are generated automatically from mistakes and
        spaced repetition — nothing to author here.

  - type: mini_test
    order_index: 12
    content:
      items:
        - slug: ordering-food-mini-mc-menu
          type: multiple_choice
          skill: vocabulary
          difficulty: A2
          vocabulary_headword: "menu"
          prompt:
            question: "What do you ask for before you order in a restaurant?"
            options:
              - id: a
                text: "the menu"
              - id: b
                text: "the bill"
              - id: c
                text: "a starter"
              - id: d
                text: "a waiter"
          answer_key:
            correct_option_id: a
          explanation: >-
            Перед заказом просят меню (menu), а счёт (bill) — после еды.

        - slug: ordering-food-mini-fill-polite-requests-2
          type: fill_blank
          skill: grammar
          difficulty: A2
          grammar_topic_slug: polite-requests
          prompt:
            text: >-
              Перепишите вежливо: 1) "Give me the menu." -> "Could I ___
              the menu, please?" (have) 2) "I want a lemonade." -> "I'd
              ___ a lemonade, please." (like)
          answer_key:
            blanks:
              - ["have"]
              - ["like"]
          explanation: >-
            "Could I have...?" и "I'd like..." — вежливые формы просьбы.

        - slug: ordering-food-mini-order-recommend
          type: sentence_ordering
          skill: grammar
          difficulty: A2
          vocabulary_headword: "recommend"
          prompt:
            words: ["recommend", "do", "What", "you"]
          answer_key:
            correct_order: ["What", "do", "you", "recommend"]
          explanation: >-
            Вопрос: "What" + вспомогательный глагол "do" + подлежащее
            "you" + смысловой глагол "recommend".

        - slug: ordering-food-mini-mc-starter
          type: multiple_choice
          skill: vocabulary
          difficulty: A2
          vocabulary_headword: "starter / main course / dessert"
          prompt:
            question: "Which course usually comes first in a meal?"
            options:
              - id: a
                text: "starter"
              - id: b
                text: "main course"
              - id: c
                text: "dessert"
              - id: d
                text: "bill"
          answer_key:
            correct_option_id: a
          explanation: >-
            Порядок блюд: starter (закуска) -> main course -> dessert.

        - slug: ordering-food-mini-reading-order
          type: reading_comprehension
          skill: reading
          difficulty: A2
          prompt:
            passage: >-
              Tom ordered a burger without onions and a salad as a
              starter. He paid the bill by card and left the café.
            questions:
              - id: q1
                text: "What did Tom order without?"
                options:
                  - id: a
                    text: "cheese"
                  - id: b
                    text: "onions"
                  - id: c
                    text: "rice"
          answer_key:
            answers:
              q1: b
          explanation: >-
            "Tom ordered a burger without onions."
